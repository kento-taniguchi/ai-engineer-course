# 毎朝、本日の ToDo を LINE に送る（Pythonによるウェブアプリ開発/notify_line.py）
# GitHub のコンピューターで動くので、自分の PC の電源が入っていなくても送られます。
#
# 必要な Secrets（GitHub のリポジトリの Settings → Secrets and variables → Actions）:
#   SPREADSHEET_ID            … スプレッドシートのID
#   GOOGLE_CREDENTIALS_JSON   … サービスアカウントの鍵ファイル（credentials.json）の中身
#   LINE_CHANNEL_ACCESS_TOKEN … LINE 公式アカウントの合鍵
#   LINE_USER_ID              … （省略可）送り先のユーザーID。無ければ友だち全員に送る

name: ToDo LINE通知

on:
  schedule:
    # GitHub の時刻は世界標準時（UTC）。UTC の 22:00 ＝ 日本時間の朝 7:00
    # ※ GitHub が混んでいると、数分〜数十分遅れることがあります
    - cron: "0 22 * * *"
  workflow_dispatch: # GitHub の画面から手動でも動かせるようにする

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: Pythonによるウェブアプリ開発
    env:
      TZ: Asia/Tokyo # 「今日」を日本の日付で判断するため
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: Pythonによるウェブアプリ開発/requirements.txt

      - name: 必要なライブラリを入れる
        run: pip install -r requirements.txt

      - name: 本日の ToDo を LINE に送る
        env:
          SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
          GOOGLE_CREDENTIALS_JSON: ${{ secrets.GOOGLE_CREDENTIALS_JSON }}
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_USER_ID: ${{ secrets.LINE_USER_ID }}
        run: |
          # 鍵ファイルを Secrets の中身から作る（終わったら GitHub のコンピューターごと消えます）
          printf '%s' "$GOOGLE_CREDENTIALS_JSON" > credentials.json
          python notify_line.py
          cat notify_line.log
