<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%233B2A20'/%3E%3Cpath d='M8 13h13v5a6 6 0 0 1-6 6h-1a6 6 0 0 1-6-6z' fill='%23F5E6D3'/%3E%3Cpath d='M21 14h2a3 3 0 0 1 0 6h-2' fill='none' stroke='%23F5E6D3' stroke-width='2'/%3E%3C/svg%3E"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#F6F1EA" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#17110D" media="(prefers-color-scheme: dark)" />
    <title>ひだまり珈琲店 AIアシスタント</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@500;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <script>
      // 画面が出る前にダークモードかどうかを決める（一瞬白く光るのを防ぐ）
      (function () {
        try {
          var t = localStorage.getItem('cafe.theme') || 'system';
          var dark = t === 'dark' || (t === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
          if (dark) document.documentElement.classList.add('dark');
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
